name: Build Flutter unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Dart 静态分析与协议回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ipa:
    name: macOS 云端编译未签名 IPA
    needs: verify
    # macos-15 池可能长时间排队；macos-14 同样自带 Xcode + iphoneos SDK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get

      - name: 编译未签名 App（产出 xcarchive）
        run: |
          set -o pipefail
          # Flutter 3.47 的 --no-codesign 只生成 Runner.xcarchive 并跳过 IPA，
          # 所以下一步从 xcarchive 里的 .app 自己打包成未签名 IPA。
          flutter build ipa --release --no-codesign 2>&1 | tee flutter-build.log

      - name: 从 xcarchive 打包未签名 IPA
        id: ipa
        run: |
          APP=$(find build/ios/archive -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::未找到 Runner.app"; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MuyuFlutter-unsigned.ipa Payload
          echo "path=MuyuFlutter-unsigned.ipa" >> "$GITHUB_OUTPUT"
          ls -lh MuyuFlutter-unsigned.ipa
          unzip -l MuyuFlutter-unsigned.ipa | head -14

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MuyuFlutter-unsigned-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
