name: Build Flutter unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Dart 静态分析与协议回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ipa:
    name: macOS 云端编译未签名 IPA
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get

      - name: 编译未签名 IPA
        run: |
          set -o pipefail
          flutter build ipa --release --no-codesign 2>&1 | tee flutter-build.log

      - name: 定位并校验 IPA
        id: ipa
        run: |
          IPA=$(find build/ios/ipa -name '*.ipa' -type f | head -1)
          if [ -z "$IPA" ]; then echo "::error::未生成 IPA"; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"
          unzip -l "$IPA" | head -14

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MuyuFlutter-unsigned-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
