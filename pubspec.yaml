name: muyu_flutter
description: "沐语 Flutter 复刻版：基于 REA 对 Muyu.exe 的逆向还原，仅接华为音乐数据源。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 播放 AVPlayer / ExoPlayer 指向本机回环租约代理
  audioplayers: ^6.1.0
  webview_flutter: ^4.14.1
  crypto: ^3.0.8
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  shared_preferences: ^2.5.3
  file_picker: ^13.4.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
